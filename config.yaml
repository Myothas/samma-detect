# Built-in defaults for every scanner, copied into each image as /config.yaml.
# An environment variable always wins over this file (README, "Settings
# precedence"). A port listed here applies only together with the https next
# to it: HTTPS=true in the environment without PORT means 443, not the port
# written below for plain HTTP.

scanner:
  name: port-scanner
  version: v0.1

output:
  write_to_file: false
  out_dir: /out
  parser: port-scanner

defaults:
  ports: [80, 443, 8080, 8443]
  timeout: 3

traceroute-scanner:
  max_hops: 30
  timeout: 2

tls-scanner:
  port: 443
  timeout: 5
  verify_cert: true

http-headers-scanner:
  port: 80
  https: false
  timeout: 5

dns-scanner:
  record_types: [A, AAAA, MX, TXT]

ssh-banner-scanner:
  port: 22
  timeout: 5

whois-scanner: {}

http-redirect-scanner:
  https: false   # the chain starts over plain HTTP; HTTPS=true starts it over TLS
  timeout: 5
  max_redirects: 10

waf-scanner:
  port: 443
  https: true
  timeout: 5
  user_agent: "samma-io-waf-scanner/1.0"
